<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Minha Sala - Atendimento</title>
    <link rel="stylesheet" href="/css/salas.css">
</head>
<body>

    <div class="main-card">
        <h2>CHAMANDO AGORA:</h2>
        <div id="currentName" class="highlight-name">---</div>
        
        <div id="transferArea" style="margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 8px; display: none;">
            <label style="display:block; color:#555; margin-bottom:5px;">Terminou? Encaminhar paciente para:</label>
            <div style="display: flex; gap: 10px;">
                <select id="transferSelect" style="flex: 1; padding: 10px;">
                    </select>
                <button onclick="transferirCliente()" style="background: #e67e22; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold;">
                    TRANSFERIR ➜
                </button>
            </div>
        </div>
    </div>

    <div class="panel">
        <label style="display:block; text-align:left; margin-bottom:5px; font-weight:bold; color:#555;">CONFIGURAR ESTA SALA:</label>
        
        <select id="configSelect">
             <option value="estagio|RECEPÇÃO|SETOR DE ESTÁGIO">RECEPÇÃO (ATENDER ESTÁGIO)</option>
            <option value="terceirizados|SALA A1|SETOR DE TERCEIRIZADOS">SALA A1 (ATENDER TERCEIRIZADOS)</option>
            <option value="diretoria|SALA A2|DIRETORIA DO DGRH">SALA A2 (DIRETORIA DO DGRH)</option>
            <option value="frequencia|SALA A3|SETOR DE FREQUÊNCIA">SALA A3 (ATENDER FREQUÊNCIA)</option>
            <option value="lotacao|SALA A4|LOTAÇÃO DE PROFESSORES">SALA A4 (ATENDER LOTAÇÃO)</option>
            <option value="ferias|SALA A5|FÉRIAS E LICENÇAS">SALA A5 (ATENDER RH/FÉRIAS)</option>
        </select>

        <div class="button-group">
            <button id="btnChamar" class="btn-next">CHAMAR PRÓXIMO ➜</button>
            <button id="btnRepetir" class="btn-repeat">🔄 REPETIR</button>
                
            <button id="btnNotificacao" onclick="ativarNotificacoes()" style="background: #3498db; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-left: 10px;">
                🔔 Ativar Alertas
            </button>
        </div>

        <div class="status-box">
            <div class="header-status">
                <span class="label-small">Pessoas aguardando para este setor:</span>
                <span class="count-big" id="myQueueCount">0</span>
            </div>
            
            <div class="queue-list-container">
                <ul id="mySectorList">
                    </ul>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/salas.js"></script>
</body>
</html>
